<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        label {
            color: white;
        }
        
        .bg-responsive-image {
            background-image: url("https://i.pinimg.com/1200x/dc/3b/6c/dc3b6c04cce8d2eb9e928630bdccbc2d.jpg");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-color: #000000; 
        }
        
        @media (max-width: 768px) {
            .bg-responsive-image {
                background-size: cover; 
                background-attachment: scroll; 
                background-position: center; 
            }
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: transparent; 
        }

        .glass-effect {
            position: relative;
            z-index: 1; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .glass-effect::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background-image: url("https://i.pinimg.com/736x/29/c6/f6/29c6f63dc6733eca561c9660b04fca7d.jpg");
            background-size: cover;
            background-position: center;
            opacity: 0.5; 
            
            z-index: -1;
        }
    </style>
</head>

<body class="bg-responsive-image min-vh-100 d-flex align-items-center">

    <div class="container d-flex justify-content-center">
        
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="card glass-effect">
                <div class="card-body p-4 p-md-5">
                    
                    <h3 class="text-center mb-4 mt-2 text-white">Create Account</h3>
                    
                    <form action="#" method="POST">
                        
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Password</label>
                            <input type="password" class="form-control" id="passwordInput" placeholder="Create a password" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Confirm your password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
                        
                        <div class="text-center mt-3">
                            <p class="mb-0 text-white">Already have an account? <a href="login.html" class="text-decoration-none fw-bold text-white">Log in here</a></p>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

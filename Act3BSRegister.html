<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        label {
            color: white;
        }

        label.error {
            color: #ff3030;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        
        .bg-responsive-image {
            background-image: url("https://i.pinimg.com/1200x/dc/3b/6c/dc3b6c04cce8d2eb9e928630bdccbc2d.jpg");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-color: #000000; 
        }
        
        @media (max-width: 768px) {
            .bg-responsive-image {
                background-size: cover; 
                background-attachment: scroll; 
                background-position: center; 
            }
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: transparent; 
        }

        .glass-effect {
            position: relative;
            z-index: 1; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .glass-effect::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background-image: url("https://i.pinimg.com/736x/29/c6/f6/29c6f63dc6733eca561c9660b04fca7d.jpg");
            background-size: cover;
            background-position: center;
            opacity: 0.5; 
            
            z-index: -1;
        }
    </style>
</head>

<body class="bg-responsive-image min-vh-100 d-flex align-items-center">

    <div class="container d-flex justify-content-center">
        
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="card glass-effect">
                <div class="card-body p-4 p-md-5">
                    
                    <h3 class="text-center mb-4 mt-2 text-white">Create Account</h3>

                    <div id="feedbackAlert" class="alert d-none" role="alert"></div>
                    
                    <form id="myForm" action="#" method="POST">
                        
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Full Name</label>
                            <input name="nameInput" type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Email address</label>
                            <input name="emailInput" type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Password</label>
                            <input name="passwordInput" type="password" class="form-control" id="passwordInput" placeholder="Create a password" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                            <input name="confirmPasswordInput" type="password" class="form-control" id="confirmPasswordInput" placeholder="Confirm your password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
                            
                        <div class="text-center mt-3">
                            <p class="mb-0 text-white">Already have an account? <a href="Act3BSLogin.html" class="text-decoration-none fw-bold text-white">click here</a></p>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            $.validator.addMethod("strongPassword", function(value, element) {
                return this.optional(element) || /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/.test(value);
            }, "Password must be at least 8 characters long, contain an uppercase, a lowercase, and a number.");

            $("#myForm").validate({
                
                rules:{
                    nameInput:{
                        required: true,
                        minlength: 3,
                        maxlength: 10
                    },
                    emailInput:{
                        required: true,
                        email: true
                    },
                    passwordInput:{
                        required: true,
                        strongPassword: true
                    },
                    confirmPasswordInput: {
                        required: true,
                        equalTo: "#passwordInput"
                    }
                },

                messages:{
                    confirmPasswordInput:{
                        equalTo: "Your password do not match. Please try again."
                    }
                },
                
                submitHandler: function(form, event) {
                    event.preventDefault(); 
                    
                    $("#feedbackAlert")
                        .removeClass("d-none alert-danger")
                        .addClass("alert-success")
                        .html("<strong>Success!</strong> All fields are valid.");
                },

                invalidHandler: function(event, validator) {
                    $("#feedbackAlert")
                        .removeClass("d-none alert-success")
                        .addClass("alert-danger")
                        .html("<strong>Error!</strong> Please check the fields below and try again.");
                }
                
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

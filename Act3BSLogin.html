<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .bg-responsive-image {
            background-image: url("https://i.pinimg.com/736x/bd/81/16/bd81162ee3ba1488f24dfa9823bfa49e.jpg");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-color: #000000; 
        }

        @media (max-width: 768px) {
            .bg-responsive-image {
                background-size: cover; 
                background-attachment: scroll; 
                background-position: center; 
            }
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: rgba(255, 255, 255, 0.92);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px 0px rgba(0, 0, 0, 0.3);
        }
        
        .login-form-container { display: block; animation: fadeIn 0.4s ease-in-out; }
        .signup-form-container { display: none; }
        #signup-target:target .login-form-container { display: none; }
        #signup-target:target .signup-form-container { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-responsive-image min-vh-100 d-flex align-items-center">

    <div class="container d-flex justify-content-center">
        <div id="signup-target" class="col-11 col-sm-8 col-md-6 col-lg-4 position-relative">
            
            <div class="card glass-effect">
                <div class="card-body p-4 p-md-5">
                    <div class="login-form-container">
                        <h3 class="text-center mb-4 text-white">Sign In</h3>
                        
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="emailInput" class="form-label text-white">Email address</label>
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="passwordInput" class="form-label text-white">Password</label>
                                <input type="password" class="form-control" id="passwordInput" placeholder="Enter your password" required>
                            </div>
                            
                            <div class="d-flex flex-column flex-sm-row justify-content-sm-between align-items-start align-items-sm-center mb-4 gap-2 gap-sm-0">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-white" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none text-white fw-bold">Forgot password?</a>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Login</button>
                            <p class="text-center text-white mb-0">
                                Don't have an account? <a href="#signup-target" class="text-decoration-none fw-bold" style="color: #90c2ff;">Sign up</a>
                            </p>
                        </form>
                    </div>
                    <div class="signup-form-container">
                        <h3 class="text-center mb-4 text-white">Create Account</h3>
                        
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="nameInput" class="form-label text-white">Full Name</label>
                                <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required>
                            </div>

                            <div class="mb-3">
                                <label for="signupEmailInput" class="form-label text-white">Email address</label>
                                <input type="email" class="form-control" id="signupEmailInput" placeholder="name@example.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="signupPasswordInput" class="form-label text-white">Password</label>
                                <input type="password" class="form-control" id="signupPasswordInput" placeholder="Create a password" required>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPasswordInput" class="form-label text-white">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Confirm your password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Register</button>
                            <p class="text-center text-white mb-0">
                                Already have an account? <a href="#" class="text-decoration-none fw-bold" style="color: #90c2ff;">Sign in</a>
                            </p>
                        </form>
                    </div>

                </div>
            </div>
            
        </div>
    </div>

</body>
</html>

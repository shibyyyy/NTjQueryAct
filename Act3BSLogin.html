<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        .bg-responsive-image {
            background-image: url("https://i.pinimg.com/736x/bd/81/16/bd81162ee3ba1488f24dfa9823bfa49e.jpg");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-color: #000000; 
        }

        @media (max-width: 768px) {
            .bg-responsive-image {
                background-size: cover; 
                background-attachment: scroll; 
                background-position: center; 
            }
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: rgba(255, 255, 255, 0.92);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px 0px rgba(0, 0, 0, 0.3);
        }

        .login-form-container { display: block; animation: fadeIn 0.4s ease-in-out; }
        .signup-form-container { display: none; }
        #signup-target:target .login-form-container { display: none; }
        #signup-target:target .signup-form-container { display: block; animation: fadeIn 0.4s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>

<body class="bg-responsive-image min-vh-100 d-flex align-items-center">

    <div class="container d-flex justify-content-center">
        <div id="signup-target" class="col-11 col-sm-8 col-md-6 col-lg-4 position-relative">

            <div class="card glass-effect">
                <div class="card-body p-4 p-md-5">
                    <div class="login-form-container">
                        <h3 class="text-center mb-4 text-white">Sign In</h3>

                        <!-- Lockout Message Container -->
                        <div id="lockoutMessage" class="alert alert-danger d-none text-center fw-bold" role="alert">
                            <!-- Countdown will appear here -->
                        </div>

                        <form id="myForm" action="#" method="POST">
                            <div class="mb-3">
                                <label for="emailInput" class="form-label text-white">Email address</label>
                                <input type="email" class="form-control" id="emailInput" name="emailInput" placeholder="name@example.com">
                            </div>

                            <div class="mb-3">
                                <label for="passwordInput" class="form-label text-white">Password</label>
                                <input type="password" class="form-control" id="passwordInput" name="passwordInput" placeholder="Enter your password">
                            </div>

                            <div class="d-flex flex-column flex-sm-row justify-content-sm-between align-items-start align-items-sm-center mb-4 gap-2 gap-sm-0">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-white" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none text-white fw-bold">Forgot password?</a>
                            </div>

                            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 mb-3">Login</button>
                            <p class="text-center text-white mb-0">
                                Don't have an account? <a href="Act3BSRegister.html" class="text-decoration-none fw-bold" style="color: #90c2ff;">click here</a>
                            </p>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        $(document).ready(function(){
            
            const MAX_ATTEMPTS = 3;
            const LOCKOUT_DURATION = 60 * 1000; 
            let countdownInterval;
            checkLockoutStatus();

            function checkLockoutStatus() {
                const lockoutUntil = localStorage.getItem("lockoutUntil");
                
                if (lockoutUntil && Date.now() < lockoutUntil) {
                    startLockoutTimer(lockoutUntil);
                } else {

                    localStorage.removeItem("lockoutUntil");
                    if(parseInt(localStorage.getItem("loginAttempts")) >= MAX_ATTEMPTS) {
                        localStorage.setItem("loginAttempts", 0);
                    }
                }
            }

            function startLockoutTimer(lockoutUntil) {

                $("#emailInput, #passwordInput, #loginBtn").prop("disabled", true);
                $("#lockoutMessage").removeClass("d-none");


                if (countdownInterval) clearInterval(countdownInterval);

                countdownInterval = setInterval(function() {
                    const now = Date.now();
                    const timeLeft = lockoutUntil - now;

                    if (timeLeft <= 0) {

                        clearInterval(countdownInterval);
                        localStorage.removeItem("lockoutUntil");
                        localStorage.setItem("loginAttempts", 0);
                        
                        $("#emailInput, #passwordInput, #loginBtn").prop("disabled", false);
                        $("#lockoutMessage").addClass("d-none");
                    } else {

                        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                        const displaySecs = seconds < 10 ? "0" + seconds : seconds;
                        
                        $("#lockoutMessage").text(`Too many attempts. Try again in ${minutes}:${displaySecs}`);
                    }
                }, 1000);
                
                const timeLeftInit = lockoutUntil - Date.now();
                const minutesInit = Math.floor((timeLeftInit % (1000 * 60 * 60)) / (1000 * 60));
                const secondsInit = Math.floor((timeLeftInit % (1000 * 60)) / 1000);
                const displaySecsInit = secondsInit < 10 ? "0" + secondsInit : secondsInit;
                $("#lockoutMessage").text(`Too many attempts. Try again in ${minutesInit}:${displaySecsInit}`);
            }

            $("#myForm").validate({
                rules:{
                    emailInput:{
                        required: true,
                        email: true
                    },
                    passwordInput:{
                        required: true
                    }
                },

                submitHandler: function(form, event) {
                    event.preventDefault();

                    if (localStorage.getItem("lockoutUntil") && Date.now() < localStorage.getItem("lockoutUntil")) {
                    }

                    var validEmail = "admin@example.com";
                    var validPassword = "12345";
                    var userEmail = $("#emailInput").val();
                    var userPassword = $("#passwordInput").val();
                    let attempts = parseInt(localStorage.getItem("loginAttempts")) || 0;

                    if (userEmail === validEmail && userPassword === validPassword) {
                        localStorage.removeItem("loginAttempts");
                        window.location.href = "Act4BSLanding.html";
                    } else {
                        attempts++;
                        localStorage.setItem("loginAttempts", attempts);

                        if (attempts >= MAX_ATTEMPTS) {
                            const lockoutUntil = Date.now() + LOCKOUT_DURATION;
                            localStorage.setItem("lockoutUntil", lockoutUntil);
                            startLockoutTimer(lockoutUntil);
                        } else {
                            const remaining = MAX_ATTEMPTS - attempts;
                            alert(`Invalid credentials. You have ${remaining} attempt(s) left. Try admin@example.com and 12345`);
                        }
                    }
                }
            });

        });
    </script>
</body>
</html>
